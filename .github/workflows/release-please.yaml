name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

# The action authenticates with RELEASE_PLEASE_TOKEN, not GITHUB_TOKEN.
permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-24.04
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
