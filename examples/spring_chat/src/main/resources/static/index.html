<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADK Spring Chat</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 1rem; }
    .msg { margin: 0.5rem 0; padding: 0.5rem 0.75rem; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e3f2fd; margin-left: 20%; }
    .agent { background: #f1f3f4; margin-right: 20%; }
    .error { background: #fdecea; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>ADK Spring Chat</h1>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Say something..." autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // crypto.randomUUID is only available on HTTPS or localhost.
    const sessionId = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');

    function append(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      append(message, 'user');
      input.value = '';
      send.disabled = true;
      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId, message }),
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        append(data.reply || '(no reply)', 'agent');
      } catch (err) {
        append('Error: ' + err.message, 'agent error');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
