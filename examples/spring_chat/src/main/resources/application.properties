# Spring AI Google GenAI chat model. Vertex AI with Application Default Credentials is the default:
# set GOOGLE_CLOUD_PROJECT (and optionally GOOGLE_CLOUD_LOCATION). To use the Gemini Developer API
# instead, set GOOGLE_GENAI_USE_VERTEXAI=false and GOOGLE_API_KEY.
spring.ai.google.genai.vertex-ai=${GOOGLE_GENAI_USE_VERTEXAI:true}
spring.ai.google.genai.project-id=${GOOGLE_CLOUD_PROJECT:}
spring.ai.google.genai.location=${GOOGLE_CLOUD_LOCATION:global}
spring.ai.google.genai.api-key=${GOOGLE_API_KEY:}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-3.8-flash}

# The chat endpoint has no authentication, so listen on loopback only unless told otherwise.
server.address=${SERVER_ADDRESS:localhost}
