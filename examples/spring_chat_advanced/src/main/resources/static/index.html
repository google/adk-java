<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ADK Spring Chat: Order Support</title>
  <style>
    body { font-family: sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    #log { border: 1px solid #ccc; border-radius: 8px; height: 60vh; overflow-y: auto; padding: 1rem; }
    .msg { margin: 0.5rem 0; padding: 0.5rem 0.75rem; border-radius: 8px; white-space: pre-wrap; }
    .user { background: #e3f2fd; margin-left: 20%; }
    .agent { background: #f1f3f4; margin-right: 20%; }
    .tool { color: #5f6368; font-size: 0.85rem; font-style: italic; margin: 0.25rem 0; }
    .error { background: #fdecea; }
    form { display: flex; gap: 0.5rem; margin-top: 1rem; }
    input { flex: 1; padding: 0.5rem; font-size: 1rem; }
    button { padding: 0.5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Order Support</h1>
  <p>Ask about orders 1001, 1002 or 1003, track a shipped order, or ask for a human.</p>
  <div id="log"></div>
  <form id="form">
    <input id="input" autocomplete="off" placeholder="Where is order 1001?" autofocus>
    <button id="send" type="submit">Send</button>
  </form>

  <script>
    // crypto.randomUUID is only available on HTTPS or localhost.
    const sessionId = crypto.randomUUID ? crypto.randomUUID() : Date.now() + '-' + Math.random();
    const log = document.getElementById('log');
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const send = document.getElementById('send');
    let bubble = null; // The agent reply being streamed, if any.

    function append(text, cls) {
      const div = document.createElement('div');
      div.className = cls;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      return div;
    }

    function agentBubble() {
      if (!bubble) bubble = append('', 'msg agent');
      return bubble;
    }

    function handle(event) {
      switch (event.type) {
        case 'partial':
          agentBubble().textContent += event.text;
          break;
        case 'text':
          // The complete reply replaces the chunks streamed before it.
          agentBubble().textContent = event.text;
          bubble = null;
          break;
        case 'tool_call':
          bubble = null;
          append('Calling ' + event.tool + '...', 'tool');
          break;
        case 'tool_result':
          append(event.tool + ' returned', 'tool');
          break;
        case 'error':
          bubble = null;
          append(event.text ? 'The reply stopped: ' + event.text : 'The agent failed. Try again.',
              'msg agent error');
          break;
        default:
          // Ignore event types this page doesn't know.
          break;
      }
      log.scrollTop = log.scrollHeight;
    }

    async function chat(message) {
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId, message }),
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = '';
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        let end;
        while ((end = buffer.indexOf('\n\n')) >= 0) {
          const data = buffer.slice(0, end).split('\n')
              .filter(line => line.startsWith('data:'))
              .map(line => line.slice(5))
              .join('\n');
          buffer = buffer.slice(end + 2);
          if (data) handle(JSON.parse(data));
        }
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      append(message, 'msg user');
      input.value = '';
      send.disabled = true;
      try {
        await chat(message);
      } catch (err) {
        append('Error: ' + err.message, 'msg agent error');
      } finally {
        bubble = null;
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
